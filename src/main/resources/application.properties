# --- Aplicación ---
quarkus.application.name=parqueadero-hexagonal
quarkus.banner.enabled=false
quarkus.log.level=INFO
quarkus.http.port=8080

# --- Base de datos MySQL (XAMPP) ---
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=root
quarkus.datasource.password=
quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3306/parqueadero?createDatabaseIfNotExist=true

# Crea/actualiza las tablas automáticamente (conserva los datos)
quarkus.hibernate-orm.schema-management.strategy=update
# MariaDB (XAMPP) reporta versión 5.5.5; se desactiva el chequeo de versión
quarkus.hibernate-orm.database.version-check.enabled=false
quarkus.hibernate-orm.log.sql=true

# --- Swagger / OpenAPI ---
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=Parqueadero USTA
quarkus.smallrye-openapi.info-version=1.0
quarkus.smallrye-openapi.info-description=Control de cupos y registro de entradas/salidas del parqueadero de la Universidad Santo Tomás.
